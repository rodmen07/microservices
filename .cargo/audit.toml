# cargo-audit configuration — the ONE enforcing home of accepted advisories.
#
# Location is load-bearing: cargo-audit loads `.cargo/audit.toml` relative to
# the directory it runs from (CI and local runs both start at the repo root).
# This file sat at the repo ROOT as `audit.toml` from commit 074af8f until
# 2026-08-08 and was NEVER loaded — the gate only behaved because both
# workflows duplicated the ignore as a CLI `--ignore` flag. That was
# AUDIT-CONFIG-DEAD-1; the CLI flags are gone now, so an entry here is the
# only thing standing between an accepted advisory and a red required check.
# Guarded by accounts-service/tests/audit_config_loaded.rs, which pins this
# path, bans the dead root location, and keeps both workflows' audit commands
# identical with no CLI --ignore.

[advisories]
ignore = [
  # RUSTSEC-2023-0071: rsa Marvin Attack — no patch available in rsa 0.9.x.
  # All services default to HS256; RSA keys are only used for token
  # verification on controlled infrastructure. Risk accepted.
  # Revisit: run `cargo update -p rsa` and re-check when upgrading dependencies.
  "RUSTSEC-2023-0071",
]
