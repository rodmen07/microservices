[package]
name = "opportunities-service"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "opportunities_service"
path = "src/lib.rs"

[[bin]]
name = "opportunities-service"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-api-kit.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["clock"] }
reqwest.workspace = true
rustls-webpki.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-gcloud-trace.workspace = true
tracing-opentelemetry.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# tests/audit_emit.rs drives the real `emit_audit` against a 127.0.0.1 stub:
# reqwest builds the client the handler holds, tokio net/time run the stub and
# bound the "no request was made" wait, serde_json reads the captured body.
reqwest.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
