name: Scheduled security audit

# ─── Why this exists, given rust.yml already has a `Security audit` job ──────
#
# rust.yml's audit job fires on `push` to main and on `pull_request`. That makes
# the advisory check a function of OUR commit cadence rather than of the RustSec
# database's publication cadence, and those two are unrelated. A newly published
# advisory against a crate that is ALREADY pinned in Cargo.lock is invisible
# until somebody happens to push.
#
# That is not hypothetical here. RUSTSEC-2026-0221 (event-listener 5.4.1,
# unsound: `StackSlot<'_, T>` unconditionally implements Send/Sync) reached the
# advisory DB after this repo's checks had last run, and it surfaced only because
# it reddened PR #119 — a LICENSE-only diff that cannot possibly introduce a Rust
# advisory. The lockfile had been carrying it silently; discovery was an accident
# of unrelated traffic.
#
# Measured on 2026-08-08, before this workflow existed:
#   - last `Security audit` on main completed 2026-08-05T17:24:01Z  →  67.4 h earlier
#   - schedule-triggered runs in this repo's history                →  0
#
# So the window between "advisory published" and "we find out" was bounded by
# nothing but our own commit rate. This workflow bounds it at 24 hours.
#
# It is deliberately a SEPARATE, LEAN workflow rather than a `schedule:` trigger
# added to rust.yml: rust.yml's other jobs cost ~23 min (Lint and test) and
# ~20 min (Coverage) per run, none of which tells us anything about advisories,
# and adding a daily cron there would also inject schedule-event runs into the
# history of two REQUIRED contexts. This job is ~3 min and required by nothing.

on:
  schedule:
    # Daily. Deliberately off the hour: GitHub queues cron workloads at :00 and
    # runs scheduled there are routinely delayed by tens of minutes.
    - cron: '17 6 * * *'

  # Manual runs, and — importantly — this workflow exercises ITSELF whenever it
  # is edited. A schedule-only workflow cannot run on the pull request that
  # introduces or changes it, which is precisely how a gate ships inert. The
  # path filter keeps that to PRs that touch this file; "Scheduled security
  # audit" is NOT a required status context, so a PR that does not touch this
  # file simply never creates the check run and nothing waits on it.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/security-audit.yml'

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Scheduled security audit
    runs-on: ubuntu-latest

    # Least privilege. This job reads the lockfile and reports through its own
    # conclusion; it creates no check run of its own, writes no comment, and
    # opens no issue, so `contents: read` is the whole requirement. (rust.yml's
    # audit job carries `checks: write` because it is a required context.)
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        # IDENTICAL to rust.yml's `Run security audit` step — the guard test
        # accounts-service/tests/audit_config_loaded.rs asserts the two
        # commands never drift apart.
        #
        # --deny warnings: without it `cargo audit` exits 0 on `unsound` and
        # `yanked` advisories, so they accumulate behind a green check. Four had
        # (see rust.yml's comment and PR #110).
        #
        # Accepted advisories live in `.cargo/audit.toml` (currently only
        # RUSTSEC-2023-0071, rsa Marvin Attack — rationale in that file), which
        # cargo-audit loads from the repo root. That file spent 074af8f..2026-08-08
        # at the repo ROOT, where cargo-audit never found it, and the gate only
        # behaved because this command carried a CLI `--ignore` duplicate
        # (AUDIT-CONFIG-DEAD-1, fixed by moving the file and dropping the flag).
        # Do not reintroduce a CLI `--ignore`: one enforcing home, the config.
        run: cargo audit --deny warnings
