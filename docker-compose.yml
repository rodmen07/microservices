# Local dev environment — all backend services
# Frontend runs separately: the React app lives in the infraportal repo
# (d:/Projects/Portfolio/infraportal) and points at these containers via env.
#
# Usage:
#   docker-compose up --build        # build + start everything
#   docker-compose up accounts contacts opportunities activities  # subset
#   docker-compose down
#
# Persistence: the `db` service mirrors CI (.github/workflows/rust.yml):
# postgres:16, user/password postgres/postgres, one logical database per
# service, created on first boot by scripts/postgres-init/. The workspace
# services compile sqlx with postgres-only drivers, so DATABASE_URL must be
# postgres:// — any other engine's URL can never connect. A drift guard in
# accounts-service/tests/ scans this file, so keep the URLs postgres.

services:

  # ── Shared PostgreSQL (mirrors the CI service container) ──────────────────

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Rust workspace services ────────────────────────────────────────────────
  # All build from workspace root context (required for cargo workspace)

  accounts:
    build:
      context: .
      dockerfile: accounts-service/Dockerfile
    ports:
      - "3010:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/accounts"
      AUTH_JWT_SECRET: "dev-insecure-secret-change-me"
      ALLOWED_ORIGINS: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  contacts:
    build:
      context: .
      dockerfile: contacts-service/Dockerfile
    ports:
      - "3011:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/contacts"
      AUTH_JWT_SECRET: "dev-insecure-secret-change-me"
      ALLOWED_ORIGINS: "http://localhost:5173"
      ACCOUNTS_SERVICE_URL: "http://accounts:8080"
    depends_on:
      db:
        condition: service_healthy

  opportunities:
    build:
      context: .
      dockerfile: opportunities-service/Dockerfile
    ports:
      - "3012:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/opportunities"
      AUTH_JWT_SECRET: "dev-insecure-secret-change-me"
      ALLOWED_ORIGINS: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  activities:
    build:
      context: .
      dockerfile: activities-service/Dockerfile
    ports:
      - "3013:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/activities"
      AUTH_JWT_SECRET: "dev-insecure-secret-change-me"
      ALLOWED_ORIGINS: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  search:
    build:
      context: .
      dockerfile: search-service/Dockerfile
    ports:
      - "8083:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/documents"
      AUTH_JWT_SECRET: "dev-insecure-secret-change-me"
      ALLOWED_ORIGINS: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  reporting:
    build:
      context: .
      dockerfile: reporting-service/Dockerfile
    ports:
      - "8086:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/reports"
      AUTH_JWT_SECRET: "dev-insecure-secret-change-me"
      ALLOWED_ORIGINS: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  # ── Go SSE hub ─────────────────────────────────────────────────────────────

  event-stream:
    build:
      context: standalones/event-stream-service
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      AUTH_JWT_SECRET: "dev-insecure-secret-change-me"
      ALLOWED_ORIGINS: "http://localhost:5173"

  # ── Django observaboard ────────────────────────────────────────────────────

  observaboard:
    build:
      context: ../observaboard
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "django-insecure-dev-key-change-me"
      DEBUG: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      ALLOWED_ORIGINS: "http://localhost:5173"

