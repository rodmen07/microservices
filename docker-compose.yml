# Local dev environment — the full Rust workspace (all 11 services)
# Frontend runs separately: the React app lives in the infraportal repo
# (d:/Projects/Portfolio/infraportal) and points at these containers via env;
# host ports below mirror that repo's .env.example so the documented local
# URLs work against compose unchanged.
#
# Usage:
#   docker-compose up --build        # build + start everything
#   docker-compose up accounts contacts opportunities activities  # subset
#   docker-compose down
#
# Self-contained by decision (2026-08-04, COMPOSE-GAP-1): compose runs exactly
# the services whose source lives in THIS repo, plus the shared db. Services
# in sibling repos run from those repos instead:
#   - event-stream (Go SSE hub): the event-stream-service repo (the old
#     `standalones/event-stream-service` context was deleted in 949b7e2 and
#     the build has been broken here since)
#   - observaboard (Django): the observaboard repo (`../observaboard` only
#     resolved when a sibling checkout happened to exist)
# A drift guard in accounts-service/tests/compose_platform_surface.rs asserts
# every build context exists inside this repo and that the service list stays
# equal to the workspace members in Cargo.toml.
#
# Persistence: the `db` service mirrors CI (.github/workflows/rust.yml):
# postgres:16, user/password postgres/postgres, one logical database per
# service, created on first boot by scripts/postgres-init/. The workspace
# services compile sqlx with postgres-only drivers, so DATABASE_URL must be
# postgres:// — any other engine's URL can never connect. A drift guard in
# accounts-service/tests/ scans this file, so keep the URLs postgres and the
# database names on CI's list.
#
# Optional integrations (search write-through indexing, observaboard ingest,
# spend billing providers) follow the workspace fail-open pattern: their env
# vars are deliberately unset here, so the services boot and serve without
# them.

services:

  # ── Shared PostgreSQL (mirrors the CI service container) ──────────────────

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Rust workspace services ────────────────────────────────────────────────
  # All build from workspace root context (required for cargo workspace)

  accounts:
    build:
      context: .
      dockerfile: accounts-service/Dockerfile
    ports:
      - "3010:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/accounts"
      AUTH_JWT_SECRET: "dev-insecure-secret-change-me"
      ALLOWED_ORIGINS: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  contacts:
    build:
      context: .
      dockerfile: contacts-service/Dockerfile
    ports:
      - "3011:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/contacts"
      AUTH_JWT_SECRET: "dev-insecure-secret-change-me"
      ALLOWED_ORIGINS: "http://localhost:5173"
      ACCOUNTS_SERVICE_URL: "http://accounts:8080"
    depends_on:
      db:
        condition: service_healthy

  opportunities:
